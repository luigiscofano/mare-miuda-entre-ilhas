<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="title description">
<title id="title">A Outra Margem: mapa das notas do violão</title>
<desc id="description">Rolagem de piano dos 76 eventos do arranjo de violão de náilon, distribuídos em 16 compassos a 90 batidas por minuto. O baixo permanece na região grave; a melodia sobe até Fá sustenido 5 na chegada e retorna a Ré 4 no último compasso.</desc>
