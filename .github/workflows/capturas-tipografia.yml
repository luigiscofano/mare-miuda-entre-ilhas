name: Capturas reais do Porto sem margens

on:
  push:
    branches:
      - qa/capturas-tipografia

permissions:
  contents: read

jobs:
  capturar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MARE_BUILD_SHA: c0208fc90b0d16a2d9d68e8039177078c502650eea2ffc20165333afa23de71a
    steps:
      - name: Preparar o código já versionado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Montar o HTML aprovado sem rede
        run: python3 edicao-oficial/montar.py "$RUNNER_TEMP/mare-miuda-prototipo.html" --verificar
      - name: Instalar a versão fixa do navegador de testes
        run: |
          npm install --prefix "$RUNNER_TEMP/mare-render" --save-exact --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/mare-render/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Capturar Porto, janelas e troca de idioma
        run: |
          export MARE_PLAYWRIGHT="$RUNNER_TEMP/mare-render/node_modules/playwright"
          node edicao-oficial/testes/capturar-galeria-temporario.mjs "$RUNNER_TEMP/mare-miuda-prototipo.html" "$RUNNER_TEMP/galeria"
      - name: Guardar 6 capturas, ensaio estreito e manifesto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: porto-sem-margens-real
          path: ${{ runner.temp }}/galeria/
          if-no-files-found: error
          retention-days: 1
