name: Verificar protótipo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.62.0
      - name: Preparar Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tests/browser_qa.py
        env:
          MARE_CAPTURA_DIR: artifacts/capturas
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capturas-praia-escala-real
          path: artifacts/capturas/*.png
      - name: Guardar prévia jogável para QA privado
        uses: actions/upload-artifact@v4
        with:
          name: mare-miuda-previa-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  navegador-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps webkit
      - name: Rodar testes num servidor local de QA
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          python tests/browser_qa.py
        env:
          MARE_BROWSER: webkit
          MARE_QA_URL: http://127.0.0.1:4173/
